{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="only light">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0 viewport-fit=cover">

    <title>{{ title }}</title>

    <link rel="icon" type="image/svg+xml" href="{% static 'svelte/assets/vite.svg' %}"/>
    {% for css in manifest_css %}
        <link rel="stylesheet" crossorigin href="/static/svelte/assets/{{ css }}">
    {% endfor %}
</head>

<body>
    <div class="app" id="app"></div>

    <script type="module" crossorigin src="/static/svelte/assets/{{ manifest_js }}"></script>
</body>
</html>
